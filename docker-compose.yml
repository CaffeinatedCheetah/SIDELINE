name: fantakes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantakes}
      POSTGRES_USER: ${POSTGRES_USER:-fantakes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fantakes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fantakes} -d ${POSTGRES_DB:-fantakes}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fantakes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fantakes}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-fantakes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fantakes}?schema=public
    command: ["npm", "run", "db:deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fantakes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fantakes}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-fantakes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fantakes}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your local .env file}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-FanTakes <no-reply@example.test>}
      ENABLE_DEV_AUTH: "false"
      CRON_SECRET: ${CRON_SECRET:-}
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  fantakes_postgres_data:
