name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Placeholder values satisfying lib/env.ts's shape validation only.
  # No live database connection is made during lint/typecheck/test/build
  # for pages using force-dynamic + try/catch data fetching.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit (advisory, non-blocking)
        run: npm audit --audit-level=high || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (test:e2e)
        # RUN_DATABASE_E2E is intentionally left unset here: the one
        # DB-dependent spec (tests/e2e/authenticated-database.spec.ts)
        # self-skips without it, since no seeded isolated Postgres test
        # database exists in this CI environment yet. That gap is
        # documented, not hidden — see docs/QA_CHECKLIST.md and the
        # skip reason in tests/e2e/accessibility.spec.ts.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots/traces on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
